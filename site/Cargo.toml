[workspace]
resolver = "2"
members = ["app", "frontend", "server"]

# Size-tuned profile for the wasm/lib build only. cargo-leptos builds the lib
# under this profile via lib-profile-release below; the SSR server binary stays
# on Cargo release defaults (opt-level 3, no LTO). See the leptos docs.
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1

[workspace.dependencies]
leptos = { version = "0.8.2" }
leptos_meta = { version = "0.8.2" }
leptos_router = { version = "0.8.2" }
leptos_axum = { version = "0.8.2" }

axum = "0.8.4"
# TLS termination for the server binary. tls-rustls selects rustls with its
# default CryptoProvider, aws-lc-rs (ring is in security-only maintenance,
# RUSTSEC-2025-0007; rustls-rustcrypto is not production-blessed for TLS).
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
cfg-if = "1.0.0"
# Component library (shadcn/Basecoat port for Leptos). Feature-per-component:
# enable only what the app uses. theme_provider is required - <ThemeProvider>
# is what injects the compiled component CSS into the page.
# "card" is unused; singlestage 0.4.1 does not seem to build without a component feature of some kind enabled.
singlestage = { version = "0.4.1", default-features = false, features = ["card", "theme_provider"] }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
http = "1.3.1"
log = "0.4.27"
thiserror = "2.0.18"
tokio = { version = "1.45.0", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.7.0", features = ["full"] }
url = "2.5.8"
wasm-bindgen = "0.2.106"

# Contract consumed by the Aspire AppHost (Portfolio.Orchestrator): the readiness
# path it health-checks. site/server registers this route and pins it to this value
# with a test, so the two sides cannot drift silently.
[workspace.metadata.orchestrator]
ready-path = "/readyz"
# Port for the auxiliary plain-http readiness listener. On TLS runs the AppHost
# injects HEALTH_ADDR from this port and probes readiness there, so the probe
# never has to trust the site certificate. (The server itself has no default:
# it binds the listener only when HEALTH_ADDR is present.)
health-port = 4002
# Whether orchestrated runs serve TLS. The AppHost injects SITE_TLS from this,
# and an ambient SITE_TLS in the AppHost's own environment overrides it. The
# deployed container sets SITE_TLS itself; this value is the dev default only.
tls = true

# See https://github.com/leptos-rs/cargo-leptos for documentation of all the parameters.

# A leptos project defines which workspace members
# that are used together frontend (lib) & server (bin)
[[workspace.metadata.leptos]]
# this name is used for the wasm, js and css file names
name = "portfolio"

# the package in the workspace that contains the server binary (binary crate)
bin-package = "server"

# the package in the workspace that contains the frontend wasm binary (library crate)
lib-package = "frontend"

# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# The source CSS file. If it ends with .sass or .scss it is compiled by dart-sass into CSS.
style-file = "style/main.css"

# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# The IP and port where the dev server serves the content.
# Production (container) binds from $PORT via LEPTOS_SITE_ADDR instead.
site-addr = "127.0.0.1:4000"

# The port to use for automatic reload monitoring
reload-port = 4001

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# Set by cargo-leptos watch when building with that tool. Controls whether autoreload JS will be included in the head
watch = false

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = []

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = []

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The cargo profile used for the lib (wasm) release build. Points at the
# size-tuned profile above so the server binary keeps Cargo release defaults.
lib-profile-release = "wasm-release"
