name: Image

# Builds the production image (Containerfile) and publishes it to the
# instance's container registry. Runs on the host-mode label (ci-host): image
# builds need kernel capabilities the unprivileged job containers don't have.
# Host-mode steps run unsandboxed, so this job uses no third-party actions -
# every step is plain shell, reviewable line by line.
#
# Instance-specific values live in repository Actions variables/secrets, not
# in this file: REGISTRY_HOST (registry hostname), REGISTRY_USER (account the
# push token belongs to), REGISTRY_TOKEN (secret, package read/write scope).
on:
  push:
    branches: [main]

# One live run per branch; a newer push cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY_HOST }}

jobs:
  image:
    runs-on: ci-host
    timeout-minutes: 60
    steps:
      - name: Resolve image name
        # Image paths must be lowercase; ${VAR,,} is bash's lowercase
        # expansion. Writing to $GITHUB_ENV carries IMAGE to later steps.
        run: |
          [ -n "$REGISTRY" ] || { echo "REGISTRY_HOST variable is not set"; exit 1; }
          echo "IMAGE=$REGISTRY/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Clone at the pushed commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Plain git instead of actions/checkout (see header comment). The
          # askpass hook answers git's credential prompt from the environment,
          # keeping the token out of argv and out of on-disk git config.
          cat > "$RUNNER_TEMP/askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            Username*) echo "x-access-token" ;;
            *) echo "$GITHUB_TOKEN" ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          # The runner injects GIT_SSL_CAINFO for containerized jobs; the file
          # it names is a container mount that doesn't exist on the host, so
          # host git must fall back to the system trust store.
          unset GIT_SSL_CAINFO
          rm -rf src
          git init -q src
          git -C src remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -C src fetch -q --depth 1 origin "$GITHUB_SHA"
          git -C src checkout -q FETCH_HEAD

      - name: Build image
        # --pull=newer refreshes the pinned base images when the registry has
        # a newer build (OS package updates arrive without a tag change).
        run: podman build --pull=newer -t "$IMAGE:$GITHUB_SHA" src

      - name: Tag latest (main only)
        if: github.ref == 'refs/heads/main'
        run: podman tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"

      - name: Push
        env:
          # The automatic per-job token authenticates but is not authorized to
          # write packages (verified: login succeeds, blob upload is denied),
          # so pushing needs the stored token - package read/write scope only.
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          # Confines the login credential to the job temp dir instead of the
          # user-level auth file, where it would outlive the job.
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        run: |
          printf '%s' "$REGISTRY_TOKEN" | podman login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          podman push --digestfile "$RUNNER_TEMP/digest" "$IMAGE:$GITHUB_SHA"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            podman push "$IMAGE:latest"
          fi

      - name: Verify registry serves the pushed digest
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          pushed=$(cat "$RUNNER_TEMP/digest")
          # Fetch the manifest back over the registry API and compare digests:
          # proves the tag is pullable and is byte-for-byte what was pushed.
          # Auth rides in a curl config via stdin, keeping it out of argv.
          auth=$(printf '%s' "$REGISTRY_USER:$REGISTRY_TOKEN" | base64 -w0)
          served=$(printf 'header = "Authorization: Basic %s"' "$auth" | \
            curl -fsS -K - -o /dev/null -D - \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              "https://$REGISTRY/v2/${GITHUB_REPOSITORY,,}/manifests/$GITHUB_SHA" | \
            tr -d '\r' | awk 'tolower($1)=="docker-content-digest:" {print $2}')
          echo "pushed: $pushed"
          echo "served: $served"
          [ -n "$served" ] && [ "$served" = "$pushed" ]

      - name: Remove registry credential
        if: always()
        run: rm -f "${{ runner.temp }}/auth.json"
