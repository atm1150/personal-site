name: Image

# Builds the production image (Containerfile), publishes it to the
# instance's container registry, scans the published image for known
# vulnerabilities, and (on main) deploys it to the production droplet.
#
# Instance-specific values live in repository Actions variables/secrets, not
# in this file: REGISTRY_HOST (registry hostname), REGISTRY_USER (account the
# registry tokens belong to), REGISTRY_TOKEN (secret, package read/write
# scope, push job only), REGISTRY_PULL_TOKEN (secret, package read scope,
# scan job only - the scanner never holds a write-capable credential).
on:
  push:
    branches: [main]
  # Manual runs (Actions tab / API) exercise the full pipeline from a branch
  # before merge; the latest tag still moves only on main.
  workflow_dispatch:

# One live run per branch; a newer push cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY_HOST }}

jobs:
  image:
    runs-on: ci-host
    timeout-minutes: 60
    # The scan job consumes these instead of recomputing the name, so the two
    # jobs can't drift apart on what was published.
    outputs:
      image: ${{ steps.name.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Resolve image name
        id: name
        # Image paths must be lowercase; ${VAR,,} is bash's lowercase
        # expansion. Writing to $GITHUB_ENV carries IMAGE to later steps.
        run: |
          [ -n "$REGISTRY" ] || { echo "REGISTRY_HOST variable is not set"; exit 1; }
          image="$REGISTRY/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Clone at the pushed commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Plain git instead of actions/checkout (see header comment). The
          # askpass hook answers git's credential prompt from the environment,
          # keeping the token out of argv and out of on-disk git config.
          cat > "$RUNNER_TEMP/askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            Username*) echo "x-access-token" ;;
            *) echo "$GITHUB_TOKEN" ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          # The runner injects GIT_SSL_CAINFO for containerized jobs; the file
          # it names is a container mount that doesn't exist on the host, so
          # host git must fall back to the system trust store.
          unset GIT_SSL_CAINFO
          rm -rf src
          git init -q src
          git -C src remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -C src fetch -q --depth 1 origin "$GITHUB_SHA"
          git -C src checkout -q FETCH_HEAD

      - name: Build image
        # --pull=newer refreshes the pinned base images when the registry has
        # a newer build (OS package updates arrive without a tag change).
        run: podman build --pull=newer -t "$IMAGE:$GITHUB_SHA" src

      - name: Tag latest (main only)
        if: github.ref == 'refs/heads/main'
        run: podman tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"

      - name: Push
        id: push
        env:
          # The automatic per-job token authenticates but is not authorized to
          # write packages (verified: login succeeds, blob upload is denied),
          # so pushing needs the stored token - package read/write scope only.
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          # Confines the login credential to the job temp dir instead of the
          # user-level auth file, where it would outlive the job.
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        run: |
          printf '%s' "$REGISTRY_TOKEN" | podman login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          podman push --digestfile "$RUNNER_TEMP/digest" "$IMAGE:$GITHUB_SHA"
          echo "digest=$(cat "$RUNNER_TEMP/digest")" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            podman push "$IMAGE:latest"
          fi

      - name: Verify registry serves the pushed digest
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          pushed=$(cat "$RUNNER_TEMP/digest")
          # Fetch the manifest back over the registry API and compare digests:
          # proves the tag is pullable and is byte-for-byte what was pushed.
          # Auth rides in a curl config via stdin, keeping it out of argv.
          auth=$(printf '%s' "$REGISTRY_USER:$REGISTRY_TOKEN" | base64 -w0)
          served=$(printf 'header = "Authorization: Basic %s"' "$auth" | \
            curl -fsS -K - -o /dev/null -D - \
              -H "Accept: application/vnd.oci.image.manifest.v1+json" \
              "https://$REGISTRY/v2/${GITHUB_REPOSITORY,,}/manifests/$GITHUB_SHA" | \
            tr -d '\r' | awk 'tolower($1)=="docker-content-digest:" {print $2}')
          echo "pushed: $pushed"
          echo "served: $served"
          [ -n "$served" ] && [ "$served" = "$pushed" ]

      - name: Remove registry credential
        if: always()
        run: rm -f "${{ runner.temp }}/auth.json"

  scan:
    # Report-only CVE scan of the published image, pulled by digest: findings
    # describe the exact bytes of the push job. Containerized (ci label)
    # so the third-party scanner stays sandboxed, holding only a read-scoped
    # credential. Targets OS packages; the Rust dependency graph is
    # cargo-deny's job in ci.yml.
    needs: image
    runs-on: ci
    timeout-minutes: 15
    container:
      # Same image the ci.yml jobs pin, so the runner already has it; the
      # scan itself needs only curl/tar. Bump alongside ci.yml + Containerfile.
      image: rust:1.98.1-bookworm
    env:
      # Pinned + checksummed so a new trivy release can't change CI behavior
      # on its own; bump both together (checksums ship with each release).
      TRIVY_VERSION: "0.74.0"
      TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
    steps:
      - name: Install trivy
        run: |
          curl -fsSL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  trivy.tar.gz\n' "$TRIVY_SHA256" | sha256sum -c -
          tar -xzf trivy.tar.gz -C /usr/local/bin trivy

      - name: Scan image
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          DIGEST: ${{ needs.image.outputs.digest }}
          TRIVY_USERNAME: ${{ vars.REGISTRY_USER }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_PULL_TOKEN }}
        # --exit-code 0 is deliberate report-only policy (revisit is tracked
        # in the issue tracker); findings surface in this job's log.
        run: |
          [ -n "$IMAGE" ] && [ -n "$DIGEST" ] || { echo "image job outputs are missing"; exit 1; }
          # Registry TLS is signed by the instance's own CA; point Go's TLS
          # stack at the CA bundle the runner already injects for git.
          export SSL_CERT_FILE="$GIT_SSL_CAINFO"
          [ -f "$SSL_CERT_FILE" ] || { echo "CA bundle not found via GIT_SSL_CAINFO"; exit 1; }
          trivy image --no-progress --exit-code 0 "$IMAGE@$DIGEST"

  deploy:
    # Ships the published image to the production droplet and restarts the
    # site there. Push-only: the runner connects out to the droplet; the
    # droplet never holds a registry credential or reaches the registry.
    # Instance values: DEPLOY_HOST (droplet address), DEPLOY_HOST_KEY (the
    # droplet's full known_hosts line, pinned so CI never trusts a host key
    # on first use), DEPLOY_SSH_KEY (secret, the droplet root key).
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_HOST != ''
    runs-on: ci-host
    timeout-minutes: 15
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        # Later steps source ssh.env for a run_ssh helper with the key and
        # pinned host key baked in.
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "DEPLOY_SSH_KEY secret is not set"; exit 1; }
          [ -n "$DEPLOY_HOST_KEY" ] || { echo "DEPLOY_HOST_KEY variable is not set"; exit 1; }
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_HOST_KEY" > "$RUNNER_TEMP/known_hosts"
          cat > "$RUNNER_TEMP/ssh.env" <<'EOF'
          run_ssh() {
            ssh -i "$RUNNER_TEMP/deploy_key" \
              -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
              -o StrictHostKeyChecking=yes \
              "root@$DEPLOY_HOST" "$@"
          }
          EOF

      - name: Clone at the pushed commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Same host-mode clone as the image job (askpass, no actions/checkout);
        # the deploy needs the quadlet file at the exact deployed commit.
        run: |
          cat > "$RUNNER_TEMP/askpass.sh" <<'EOF'
          #!/bin/sh
          case "$1" in
            Username*) echo "x-access-token" ;;
            *) echo "$GITHUB_TOKEN" ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass.sh"
          unset GIT_SSL_CAINFO
          rm -rf src
          git init -q src
          git -C src remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git -C src fetch -q --depth 1 origin "$GITHUB_SHA"
          git -C src checkout -q FETCH_HEAD

      - name: Prepare droplet
        # Idempotent bootstrap: asserts the desired droplet state and changes
        # only what differs, so the first run is setup and later runs are
        # no-op checks. Rootless runtime, root-managed: the quadlet lives in
        # /etc/containers/systemd/users/<uid> and runs as the site user.
        run: |
          . "$RUNNER_TEMP/ssh.env"
          run_ssh bash -s <<'EOF'
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          command -v podman >/dev/null || { apt-get -qq update && apt-get -qq install -y podman; }
          # Pinned upstream lego: Debian's build omits the porkbun DNS provider.
          lego_version=5.4.0
          lego_sha256=d3adf89392d606ce84d485c1cc20832edd42ace6ff9ced9dd3670d9d8b8aca38
          if ! /usr/local/bin/lego --version 2>/dev/null | grep -q "version $lego_version "; then
            curl -sSL -o /tmp/lego.tgz "https://github.com/go-acme/lego/releases/download/v${lego_version}/lego_v${lego_version}_linux_amd64.tar.gz"
            echo "$lego_sha256  /tmp/lego.tgz" | sha256sum -c -
            tar -xzf /tmp/lego.tgz -C /tmp lego
            install -m 0755 /tmp/lego /usr/local/bin/lego
            rm -f /tmp/lego.tgz /tmp/lego
          fi
          apt-get -qq purge -y lego 2>/dev/null || true
          id site >/dev/null 2>&1 || useradd --create-home --shell /usr/sbin/nologin site
          loginctl enable-linger site
          printf 'net.ipv4.ip_unprivileged_port_start=80\n' > /etc/sysctl.d/50-unprivileged-ports.conf
          sysctl -q -p /etc/sysctl.d/50-unprivileged-ports.conf
          # Group-site: the rootless runtime must traverse into the cert mount.
          install -d -m 0750 -g site /etc/portfolio /etc/portfolio/certs
          install -d -m 0700 /var/lib/portfolio-lego
          printf 'PasswordAuthentication no\n' > /etc/ssh/sshd_config.d/50-no-passwords.conf
          sshd -t && systemctl reload ssh
          install -d "/etc/containers/systemd/users/$(id -u site)"
          EOF
          uid=$(run_ssh id -u site)
          run_ssh "cat > /etc/containers/systemd/users/$uid/portfolio-site.container" \
            < src/deploy/portfolio-site.container
          run_ssh "systemctl --user --machine=site@.host daemon-reload"
          # Safe pre-credential: the units' ConditionPathExists skip cleanly.
          for unit in portfolio-certs-renew.timer portfolio-certs-renew.service \
                      portfolio-certs-install.service portfolio-certs-issue.service; do
            run_ssh "cat > /etc/systemd/system/$unit" < "src/deploy/$unit"
          done
          run_ssh "systemctl daemon-reload && systemctl enable --now portfolio-certs-renew.timer"

      - name: Ship image to droplet
        env:
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REGISTRY_PULL_TOKEN: ${{ secrets.REGISTRY_PULL_TOKEN }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/auth.json
        # The registry manifest digest does not survive save/load; the image
        # ID (config digest) does, and pins the same filesystem content, so
        # it is the cross-machine comparator.
        run: |
          . "$RUNNER_TEMP/ssh.env"
          printf '%s' "$REGISTRY_PULL_TOKEN" | podman login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          podman pull -q "$IMAGE@$DIGEST"
          image_id=$(podman image inspect --format '{{.Id}}' "$IMAGE@$DIGEST")
          uid=$(run_ssh id -u site)
          # -C /: escape root's 0700 home before podman's rootless re-exec
          # chdirs back into it as site. -u: drop root's session bus (podman
          # finds site's own via XDG_RUNTIME_DIR) and the SSH_* variables
          # naming the admin connection's source address.
          sp="runuser -u site -- env -C / -u DBUS_SESSION_BUS_ADDRESS -u SSH_CLIENT -u SSH_CONNECTION XDG_RUNTIME_DIR=/run/user/$uid podman"
          run_ssh "! $sp image exists localhost/portfolio-site:current || $sp tag localhost/portfolio-site:current localhost/portfolio-site:previous"
          podman save --format oci-archive "$image_id" | run_ssh "$sp load -q"
          run_ssh "$sp tag $image_id localhost/portfolio-site:current"
          landed=$(run_ssh "$sp image inspect --format '{{.Id}}' localhost/portfolio-site:current")
          echo "pushed image id: $image_id"
          echo "landed image id: $landed"
          [ -n "$landed" ] && [ "$landed" = "$image_id" ]

      - name: Restart and verify
        # --resolve pins the site's name to the droplet, so the check
        # validates the real certificate without waiting on public DNS.
        run: |
          . "$RUNNER_TEMP/ssh.env"
          run_ssh "systemctl --user --machine=site@.host restart portfolio-site.service"
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors -o /dev/null \
            --resolve "atmiller.org:443:$DEPLOY_HOST" "https://atmiller.org/readyz"
          redirect=$(curl -fsS -o /dev/null -w '%{http_code} %{redirect_url}' "http://$DEPLOY_HOST/")
          [ "$redirect" = "301 https://atmiller.org/" ]
          echo "deploy verified: https /readyz returned 200, port 80 redirects"
          # Drop images that lost their last tag in the :previous rotation.
          uid=$(run_ssh id -u site)
          run_ssh "runuser -u site -- env -C / -u DBUS_SESSION_BUS_ADDRESS -u SSH_CLIENT -u SSH_CONNECTION XDG_RUNTIME_DIR=/run/user/$uid podman image prune -f"

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/auth.json"
